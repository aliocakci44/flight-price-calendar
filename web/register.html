<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="authbody">
<header class="top">
  <div class="langsel">
    <select id="lang" aria-label="Language" data-i18n-aria="lang_label"></select>
  </div>
</header>

<main class="authwrap">
  <form id="authform" class="authbox" method="post" action="/register">
    <h1><span aria-hidden="true">&#9992;</span> <span data-i18n="title">Flight Price Calendar</span></h1>

    <h2 data-i18n="rg_title">Register</h2>
    <p id="errmsg" class="autherr" hidden></p>

    <label for="invite" data-i18n="rg_invite">Invite code</label>
    <input id="invite" name="invite" spellcheck="false" required autofocus>

    <label for="username" data-i18n="lg_user">Username</label>
    <input id="username" name="username" maxlength="20"
           autocomplete="username" spellcheck="false" required>

    <label for="password" data-i18n="lg_pass">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="new-password" minlength="8" required>

    <label for="password2" data-i18n="rg_pass2">Password (repeat)</label>
    <input id="password2" name="password2" type="password"
           autocomplete="new-password" minlength="8" required>

    <div id="tsbox" data-sitekey="__TS_SITE__"></div>

    <button type="submit" class="go" data-i18n="rg_create">Create account</button>

    <p class="authlinks">
      <span data-i18n="rg_have">Already have an account?</span>
      <a href="/login" data-i18n="lg_signin">Sign in</a>
    </p>
    <p class="authlinks dim">
      <a href="/" data-i18n="lg_tosite">Back to the calendar</a>
    </p>
  </form>
</main>

<script src="/i18n.js"></script>
<script src="/auth.js"></script>
</body>
</html>
